version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: gpc-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 0.25
    networks:
      - gpc-network

  backend:
    build: ./backend
    container_name: gpc-backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=gpc_store
      - CORS_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - mongodb
    networks:
      - gpc-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://josten-garten.de}
    container_name: gpc-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gpc-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  gpc-network:
    driver: bridge
